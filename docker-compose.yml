services:
  postgres:
    image: postgres:17
    container_name: open-calendar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar_dev_password
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: